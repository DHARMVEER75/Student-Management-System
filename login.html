<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f2f2f2;
        }

        .container{
            width:400px;
            margin:80px auto;
            background:white;
            padding:25px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }

        h1{
            text-align:center;
            color:#0d6efd;
            margin-bottom:20px;
        }

        fieldset{
            border:2px solid #0d6efd;
            border-radius:8px;
            margin-bottom:20px;
            padding:15px;
        }

        legend{
            color:#0d6efd;
            font-weight:bold;
            padding:0 10px;
        }

        table{
            width:100%;
        }

        td{
            padding:10px;
        }

        input[type=text],
        input[type=password]{

            width:100%;
            padding:8px;
            border:1px solid gray;
            border-radius:5px;
            font-size:15px;
        }

        input[type=text]:focus,
        input[type=password]:focus{

            border:2px solid #0d6efd;
            outline:none;
        }

        .btn{
            text-align:center;
        }

        input[type=submit],
        input[type=reset]{

            background:#0d6efd;
            color:white;
            border:none;
            padding:10px 20px;
            font-size:16px;
            border-radius:5px;
            cursor:pointer;
            margin:5px;
        }

        input[type=submit]:hover{
            background:#084298;
        }

        input[type=reset]{
            background:#6c757d;
        }

        input[type=reset]:hover{
            background:#495057;
        }

        .link{
            text-align:center;
            margin-top:10px;
        }

        .link a{
            color:#0d6efd;
            text-decoration:none;
        }

        .link a:hover{
            text-decoration:underline;
        }

    </style>

</head>

<body>

<div class="container">

<h1>Login</h1>

<form action="login" method="post">

    <fieldset>

        <legend>User Login</legend>

        <table>

            <tr>
                <td>Username</td>
                <td>
                    <input type="text" name="name" placeholder="Enter Username" required>
                </td>
            </tr>

            <tr>
                <td>Password</td>
                <td>
                    <input type="password" name="pass" placeholder="Enter Password" required>
                </td>
            </tr>

        </table>

    </fieldset>

    <div class="btn">
        <input type="submit" value="Login">
        <input type="reset" value="Reset">
    </div>

</form>

<div class="link">
    Not registered yet? <a href="register.html">Register here</a>
</div>

</div>

<script>
    // 1 hour wali cookies se username/password ko fields mein autofill karna
    function getCookie(cname){
        let cname1 = cname + "=";
        let parts = document.cookie.split(';');
        for(let i=0; i<parts.length; i++){
            let part = parts[i].trim();
            if(part.indexOf(cname1) === 0){
                return decodeURIComponent(part.substring(cname1.length));
            }
        }
        return "";
    }

    window.onload = function(){
        let uname = getCookie("uname");
        let upass = getCookie("upass");
        if(uname !== ""){
            document.getElementsByName("name")[0].value = uname;
        }
        if(upass !== ""){
            document.getElementsByName("pass")[0].value = upass;
        }
    };
</script>

</body>
</html>
