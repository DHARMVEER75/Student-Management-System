<!DOCTYPE html>
<html>
<head>
    <title>Register</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f2f2f2;
        }

        .container{
            width:400px;
            margin:80px auto;
            background:white;
            padding:25px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }

        h1{
            text-align:center;
            color:#dc3545;
            margin-bottom:20px;
        }

        fieldset{
            border:2px solid #dc3545;
            border-radius:8px;
            margin-bottom:20px;
            padding:15px;
        }

        legend{
            color:#dc3545;
            font-weight:bold;
            padding:0 10px;
        }

        table{
            width:100%;
        }

        td{
            padding:10px;
        }

        input[type=text],
        input[type=password]{

            width:100%;
            padding:8px;
            border:1px solid gray;
            border-radius:5px;
            font-size:15px;
        }

        input[type=text]:focus,
        input[type=password]:focus{

            border:2px solid #dc3545;
            outline:none;
        }

        .btn{
            text-align:center;
        }

        input[type=submit],
        input[type=reset]{

            background:#dc3545;
            color:white;
            border:none;
            padding:10px 20px;
            font-size:16px;
            border-radius:5px;
            cursor:pointer;
            margin:5px;
        }

        input[type=submit]:hover{
            background:#a71d2a;
        }

        input[type=reset]{
            background:#6c757d;
        }

        input[type=reset]:hover{
            background:#495057;
        }

        .link{
            text-align:center;
            margin-top:10px;
        }

        .link a{
            color:#dc3545;
            text-decoration:none;
        }

        .link a:hover{
            text-decoration:underline;
        }

    </style>

</head>

<body>

<div class="container">

<h1>Register</h1>

<div id="loginFailMsg" style="display:none;text-align:center;color:#dc3545;margin-bottom:15px;">
    Invalid username or password/Please register here first
</div>

<script>
    if(window.location.search.indexOf("notfound=1") !== -1){
        document.getElementById("loginFailMsg").style.display = "block";
    }
</script>

<form action="register" method="post">

    <fieldset>

        <legend>New User Details</legend>

        <table>

            <tr>
                <td>Username</td>
                <td>
                    <input type="text" name="newname" placeholder="Enter Username" required>
                </td>
            </tr>

            <tr>
                <td>Password</td>
                <td>
                    <input type="password" name="newpass" placeholder="Enter Password" required>
                </td>
            </tr>

        </table>

    </fieldset>

    <div class="btn">
        <input type="submit" value="Register">
        <input type="reset" value="Reset">
    </div>

</form>

<div class="link">
    Already registered? <a href="login.html">Login here</a>
</div>

</div>

</body>
</html>
